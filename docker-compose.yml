# PostgreSQL wyłącznie na potrzeby local dev.
# Produkcyjny RDS jest prywatny i celowo nieosiągalny z laptopa — patrz README.
services:
  postgres:
    image: postgres:16-alpine
    container_name: zoja-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: zoja
      POSTGRES_USER: postgres
      # Hasło lokalne, jawnie nieprodukcyjne. Musi zgadzać się z .env.
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - zoja-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zoja"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  zoja-pgdata:
